# Nixpacks build config for Railway
# Pins Node 20 (LTS) so the build is reproducible.
# Uses `npm install` (not `npm ci`) because no package-lock.json is committed yet;
# once you run `npm install` locally and commit the lockfile, switch to `npm ci`.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --no-audit --no-fund --progress=false"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
